<!DOCTYPE html>

  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="stylesheet" href="/static/css/tokens.css">

  <script type="module" src="/static/js/main.js"></script>

    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>

  </svg>

  <header id="site-header">
    <div class="header-container">
      <div class="header-left">
        <div id="logo-slot"></div>
        <div class="header-titles">
          <h1>Visual Cryptography</h1>
          <p class="subtitle">Progress Review II · Design &amp; Implementation Review</p>
        </div>
      </div>
      <div class="header-right">
        <span class="review-chip">10 Oct 2026</span>
        <button id="theme-toggle" class="btn-icon-only" type="button" aria-label="Switch colour theme">
          <svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="tabs-nav-wrapper">
      <nav class="tabs-nav" role="tablist" aria-label="Visual Cryptography Sections">
        <button id="tab-generate" class="tab-btn" role="tab" aria-selected="true" aria-controls="panel-generate" tabindex="0">
          <svg class="icon" aria-hidden="true"><use href="#i-layers"></use></svg>
          <span>Generate</span>
        </button>
        <button id="tab-reconstruct" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-reconstruct" tabindex="-1">
          <svg class="icon" aria-hidden="true"><use href="#i-link"></use></svg>
          <span>Reconstruct</span>
        </button>
        <button id="tab-compare" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-compare" tabindex="-1">
          <svg class="icon" aria-hidden="true"><use href="#i-sliders"></use></svg>
          <span>Compare</span>
        </button>
        <button id="tab-about" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-about" tabindex="-1">
          <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>
          <span>About</span>
        </button>
      </nav>
    </div>

    <section id="panel-generate" class="tab-panel" role="tabpanel" aria-labelledby="tab-generate">
      <!-- Hidden template references for smoke test verification before JS init -->
      <div hidden>
        <div role="tablist">
          <button id="rtab-overview" role="tab" aria-controls="rpanel-overview"></button>
          <button id="rtab-shares" role="tab" aria-controls="rpanel-shares"></button>
          <button id="rtab-metrics" role="tab" aria-controls="rpanel-metrics"></button>
          <button id="rtab-stack" role="tab" aria-controls="rpanel-stack"></button>
        </div>
        <div id="rpanel-overview" role="tabpanel"></div>
        <div id="rpanel-shares" role="tabpanel"></div>
        <div id="rpanel-metrics" role="tabpanel"></div>
        <div id="rpanel-stack" role="tabpanel"></div>
      </div>
    </section>

    <section id="panel-reconstruct" class="tab-panel" role="tabpanel" aria-labelledby="tab-reconstruct" hidden>
      <!-- Generated dynamically by reconstruct.js -->
    </section>

    <section id="panel-compare" class="tab-panel" role="tabpanel" aria-labelledby="tab-compare" hidden>
      <!-- Generated dynamically by compare.js -->
    </section>

    <section id="panel-about" class="tab-panel" role="tabpanel" aria-labelledby="tab-about" hidden>
      <!-- Generated dynamically by about.js -->
    </section>
  </main>

  <div id="toast-region" aria-live="polite"></div>

  <dialog id="inspector-dialog"></dialog>

  <footer id="site-footer">Visual Cryptography | Progress Review II | SSPU | 10 October 2026</footer>
</body>
</html>
